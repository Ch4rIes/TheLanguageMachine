# MacBook training config (CPU / MPS)
# Target: ~40M tokens = batch_size × max_iters × context_length = 32 × 5000 × 256
# Expected: ~36 min on MPS (M3 Max), val loss ~1.80 at step 5000

train_data_path: "data/train.bin"
val_data_path: "data/val.bin"

batch_size: 32
max_iters: 5000
grad_clip_norm: 1.0

log_interval: 10
val_interval: 100
checkpoint_interval: 1000
checkpoint_dir: "checkpoints"

# Use "mps" for Apple Silicon, "cpu" as fallback
device: "mps"

model:
  vocab_size: 10000
  context_length: 256
  num_layers: 6
  d_model: 512
  num_heads: 8
  d_ff: 1024
  theta: 10000.0

optimizer:
  lr: 1e-3
  betas: [0.9, 0.999]
  eps: 1e-8
  weight_decay: 0.01

# Cosine decay terminates exactly at max_iters (step 5000)
scheduler:
  warmup_iters: 100
  cosine_cycle_iters: 5000
  min_lr_ratio: 0.1
